<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Assinatura de e-mail — PigBank</title>
  </head>
  <body style="margin: 24px; background: #ffffff">
    <!-- Copie somente a tabela abaixo para o editor de assinatura do e-mail. -->
    <table
      role="presentation"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="
        border-collapse: collapse;
        color: #111111;
        font-family: Arial, Helvetica, sans-serif;
        line-height: 1.35;
      "
    >
      <tr>
        <td style="padding: 0 18px 0 0; vertical-align: middle">
          <img
            src="pigbank-mascote-email.png"
            width="104"
            alt="Mascote PigBank"
            style="display: block; width: 104px; height: auto; border: 0"
          />
        </td>
        <td
          style="
            width: 3px;
            background: #ff2d8e;
            border-radius: 3px;
            font-size: 0;
            line-height: 0;
          "
        >
          &nbsp;
        </td>
        <td style="padding: 2px 0 2px 18px; vertical-align: middle">
          <div
            style="
              margin: 0 0 2px;
              color: #111111;
              font-size: 18px;
              font-weight: 700;
              letter-spacing: -0.2px;
            "
          >
            SEU NOME
          </div>
          <div style="margin: 0 0 9px; color: #6b6b6b; font-size: 12px">
            Seu cargo <span style="color: #ff2d8e">•</span>
            <strong style="color: #111111">PigBank</strong>
          </div>
          <div style="margin: 0 0 3px; color: #6b6b6b; font-size: 12px">
            <strong style="color: #ff2d8e">E</strong>&nbsp;
            <a
              href="mailto:seu.nome@pigbankai.com"
              style="color: #111111; text-decoration: none"
              >seu.nome@pigbankai.com</a
            >
          </div>
          <div style="margin: 0 0 3px; color: #6b6b6b; font-size: 12px">
            <strong style="color: #ff2d8e">T</strong>&nbsp;
            <a
              href="tel:+5500000000000"
              style="color: #111111; text-decoration: none"
              >+55 (00) 00000-0000</a
            >
          </div>
          <div style="margin: 0; color: #6b6b6b; font-size: 12px">
            <strong style="color: #ff2d8e">W</strong>&nbsp;
            <a
              href="https://pigbankai.com"
              style="color: #111111; text-decoration: none"
              >pigbankai.com</a
            >
          </div>
        </td>
      </tr>
    </table>
  </body>
</html>
