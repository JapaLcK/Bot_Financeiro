appId: ${APP_ID}
---
- launchApp:
    clearState: true
    clearKeychain: true
- tapOn: "Já tenho conta"
- runFlow: _entrar.yaml
- tapOn: "Usar código de backup"
- tapOn:
    text: "Código de backup"
    below: "Código de backup"
- inputText: ${BACKUP}
- tapOn: "Verificar"
- extendedWaitUntil:
    visible: "Olá, .*|Código inválido.*|Muitas tentativas.*"
    timeout: 20000
- assertVisible: "Olá, E2E"
