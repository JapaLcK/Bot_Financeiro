appId: ${APP_ID}
---
- launchApp:
    clearState: true
    clearKeychain: true
- tapOn: "Já tenho conta"
- runFlow: _entrar.yaml
- tapOn:
    text: "Código de 6 dígitos"
    below: "Código de 6 dígitos"
- inputText: ${TOTP} # o 6º dígito envia sozinho
- extendedWaitUntil:
    visible: "Olá, .*|Código inválido.*|Muitas tentativas.*|Algo deu errado.*"
    timeout: 20000
# 429 ou falha genérica caem aqui, com nome próprio: nunca no passo que o negativo mede.
- assertNotVisible: "Muitas tentativas.*"
- assertNotVisible: "Algo deu errado.*"
- assertVisible: "Olá, E2E"
