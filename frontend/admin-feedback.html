<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#07121d" />
<meta name="robots" content="noindex, nofollow" />
<title>PigBank — Feedback do Piggy</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #07121d; --panel: rgba(10,20,34,.88); --panel-2: rgba(255,255,255,.04);
  --border: rgba(255,255,255,.08); --text: #edf6ff; --muted: rgba(237,246,255,.6);
  --soft: rgba(237,246,255,.52); --pink: #FF2D8E; --red: #f87171;
}
body { font-family: "Segoe UI", system-ui, sans-serif; color: var(--text); background: var(--bg); min-height: 100vh; line-height: 1.45; }
.shell { max-width: 1180px; margin: 0 auto; padding: 20px 16px 60px; }
header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
h1 { font-size: 24px; }
.ctl { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
button, .btn {
  border: 1px solid var(--border); background: var(--panel-2); color: var(--text); border-radius: 12px;
  padding: 10px 14px; min-height: 40px; font-size: 13px; cursor: pointer; text-decoration: none;
  display: inline-flex; align-items: center;
}
button:hover:not(:disabled), .btn:hover { background: rgba(255,255,255,.08); }
[hidden] { display: none !important; }
button:focus-visible, .btn:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }
#status { font-size: 12px; color: var(--muted); }
#status.err { color: var(--red); }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 18px; min-width: 0; margin-bottom: 14px; }
.card h2 { font-size: 16px; margin-bottom: 4px; }
.what { font-size: 12.5px; color: var(--muted); margin-bottom: 14px; }
.tblwrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: right; padding: 8px 6px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { font-size: 11px; color: var(--soft); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.item { border-bottom: 1px solid var(--border); padding: 12px 0; }
.item:last-child { border-bottom: 0; }
.meta { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 14px; margin-bottom: 6px; }
.meta .motivo { color: var(--pink); font-weight: 600; }
.lbl { font-size: 11px; color: var(--soft); text-transform: uppercase; letter-spacing: .06em; margin-top: 8px; }
.txt { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13.5px; }
.empty { color: var(--muted); font-size: 13px; padding: 8px 0; }
@media (max-width: 820px),
       (max-height: 520px) and (orientation: landscape) and (max-width: 950px) {
  .shell {
    padding: calc(20px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
             calc(60px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
  }
}
</style>
</head>
<body>
<div class="shell">
  <header>
    <h1>PigBank — Feedback do Piggy</h1>
    <div class="ctl">
      <span id="status" role="status"></span>
      <button type="button" id="refresh">↻ Atualizar</button>
      <a class="btn" href="/admin">Monitoramento</a>
    </div>
  </header>
  <main id="main">
    <section class="card">
      <h2>Por semana</h2>
      <p class="what">Semanas de segunda a domingo (horário de Brasília). 👎 sem motivo vêm de versões antigas do app.</p>
      <div class="tblwrap"><table id="semanas"></table></div>
    </section>
    <section class="card">
      <h2 id="negs-titulo">Respostas com 👎</h2>
      <p class="what">Da mais nova para a mais antiga. Só data e id da mensagem: sem nome, e-mail ou conta.</p>
      <div id="negs"></div>
      <div class="ctl" style="margin-top:12px"><button type="button" id="mais" hidden>Carregar mais</button></div>
    </section>
  </main>
</div>

<script>
// Todo texto da API é conteúdo de usuário: entra só por textContent, nunca por innerHTML.
(function () {
  const tokenKey = "finbot_admin_token";
  const PAGINA = 50;
  let motivos = {}, carregados = 0, ocupado = false;

  function el(tag, texto, cls) {
    const e = document.createElement(tag);
    if (texto != null) e.textContent = texto;
    if (cls) e.className = cls;
    return e;
  }
  const dh = (iso) => new Date(iso).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short", timeZone: "America/Sao_Paulo" });
  const dia = (iso) => String(iso).split("-").reverse().join("/");  // "2026-10-12" -> "12/10/2026"

  function setStatus(msg, err) {
    const s = document.getElementById("status");
    s.textContent = msg; s.classList.toggle("err", !!err);
  }

  function renderSemanas(semanas) {
    const t = document.getElementById("semanas");
    t.replaceChildren();
    if (!semanas.length) { t.appendChild(el("caption", "Nenhuma nota ainda.", "empty")); return; }
    const chaves = Object.keys(motivos);
    const cab = el("tr");
    ["Semana de", "👍", "👎"].concat(chaves.map((k) => motivos[k]), ["Fora da lista", "Sem motivo"])
      .forEach((h) => cab.appendChild(el("th", h)));
    t.appendChild(cab);
    semanas.forEach((s) => {
      const tr = el("tr");
      [dia(s.semana), s.positivos, s.negativos].concat(chaves.map((k) => s.por_motivo[k] || 0), [s.outros_motivos, s.sem_motivo])
        .forEach((v) => tr.appendChild(el("td", String(v))));
      t.appendChild(tr);
    });
  }

  function renderItem(it) {
    const d = el("article", null, "item");
    const meta = el("div", null, "meta");
    meta.appendChild(el("span", dh(it.created_at)));
    meta.appendChild(el("span", "#" + it.id));
    meta.appendChild(el("span", it.rotulo || it.motivo || "Sem motivo", it.motivo ? "motivo" : ""));
    d.appendChild(meta);
    d.appendChild(el("div", "Pergunta", "lbl"));
    d.appendChild(el("p", it.pergunta || "—", "txt"));
    d.appendChild(el("div", "Resposta", "lbl"));
    d.appendChild(el("p", it.resposta || "—", "txt"));
    if (it.texto) {
      d.appendChild(el("div", "Comentário", "lbl"));
      d.appendChild(el("p", it.texto, "txt"));
    }
    return d;
  }

  async function carrega(zerar) {
    if (ocupado) return;
    ocupado = true;
    setStatus("Buscando dados…");
    try {
      const t = localStorage.getItem(tokenKey);
      const off = zerar ? 0 : carregados;
      const res = await fetch(`/admin/api/feedback?limit=${PAGINA}&offset=${off}`, { headers: t ? { Authorization: `Bearer ${t}` } : {}, cache: "no-store" });
      if (res.status === 401) { window.location.href = "/admin/login"; return; }
      if (!res.ok) throw new Error("HTTP " + res.status);
      const d = await res.json();
      motivos = d.motivos;
      const box = document.getElementById("negs");
      if (zerar) { box.replaceChildren(); carregados = 0; renderSemanas(d.semanas); }
      d.itens.forEach((it) => box.appendChild(renderItem(it)));
      carregados += d.itens.length;
      if (!carregados) box.appendChild(el("p", "Nenhum 👎 ainda.", "empty"));
      document.getElementById("negs-titulo").textContent = `Respostas com 👎 (${d.total})`;
      document.getElementById("mais").hidden = !d.itens.length || carregados >= d.total;
      setStatus("");
    } catch (err) {
      setStatus("Falha ao carregar o feedback (" + err.message + "). Tente atualizar.", true);
    } finally {
      ocupado = false;
    }
  }

  document.getElementById("refresh").addEventListener("click", () => carrega(true));
  document.getElementById("mais").addEventListener("click", () => carrega(false));
  carrega(true);
})();
</script>
</body>
</html>
