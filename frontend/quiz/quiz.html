@font-face { font-family: "Archivo"; font-style: normal; font-weight: 400 900; font-stretch: 62% 125%; font-display: swap; src: url("/quiz/assets/Archivo-Variable.woff2") format("woff2"); }
:root {
  --rosa: #FF2D8E; --rosa-forte: #E0177A; --rosa-escuro: #D4106B; --rosa-claro: #F7D7E3; --rosa-vidro: #FFF1F7;

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--fundo); color: var(--tinta); font-family: "Archivo", -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }

.pular { position: absolute; left: -9999px; top: 8px; background: var(--tinta); color: #fff; padding: 10px 14px; border-radius: 10px; z-index: 10; }

.voltar { width: 40px; height: 40px; border: 0; background: transparent; color: var(--tinta-2); display: grid; place-items: center; border-radius: 50%; cursor: pointer; }

.quem span i { width: 8px; height: 8px; border-radius: 50%; background: var(--lima); box-shadow: 0 0 0 2px rgba(198,241,26,.25); }

.progresso { background: var(--rosa-claro); overflow: hidden; }

.balao { max-width: min(82%, 460px); padding: 11px 15px; border-radius: var(--raio) var(--raio) var(--raio) 7px; background: var(--cartao); border: 1px solid var(--borda); font-size: 15px; line-height: 1.5; }
.balao b { font-weight: 800; }

.entra { animation: entra .32s cubic-bezier(.2,.8,.2,1) both; }

.testa { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 2px 12px 10px; }

.cta { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 54px; border-radius: 14px; background: var(--rosa-forte); color: #fff; text-decoration: none; font-weight: 800; font-size: 16.5px; letter-spacing: -.005em; box-shadow: 0 10px 22px rgba(255,45,142,.28); transition: transform .15s, background .2s; }
.cta:active { transform: scale(.985); }
.cta small { font-weight: 700; opacity: .9; font-size: 13px; }
.alt { text-align: center; font-size: 13.5px; color: var(--mudo); }
.alt a { color: var(--tinta-2); font-weight: 700; text-underline-offset: 3px; }

@media (hover: hover) {
  .voltar:hover { background: var(--fundo); }
  .refazer:hover { text-decoration: underline; }
  .opcoes button:hover, .testa button:hover { border-color: var(--rosa); background: var(--rosa-vidro); }

}
@media (max-width: 359px) { .testa button { white-space: normal; text-align: left; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

  var N = PERGUNTAS.length;

  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  function negrito(alvo, txt) { // **x** vira <b>x</b>, sempre por textContent
    txt.split("**").forEach(function (parte, i) { if (!parte) return; alvo.appendChild(i % 2 ? el("b", null, parte) : document.createTextNode(parte)); });
    return alvo;
  }
  function avatar() { var d = el("div", "avatar"); var im = el("img"); im.src = "/quiz/assets/piggy-avatar.png"; im.alt = ""; im.width = 30; im.height = 30; d.appendChild(im); return d; }
  var ICON_SETA = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>';
  var ICON_OK = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
  var ICON_LIDO = '<svg width="16" height="11" viewBox="0 0 16 11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 6l3 3 6-7"/><path d="M6 8.5l1 .5 6-7"/></svg>';
  var colado = true; // a pessoa está no fim da conversa? se subiu para reler, a tela não puxa
  feed.addEventListener("scroll", function () { colado = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 160; }, { passive: true });
  function rolar(forca) { if (forca) colado = true; if (!colado) return; feed.scrollTop = feed.scrollHeight; requestAnimationFrame(function () { feed.scrollTop = feed.scrollHeight; }); }
  try { new ResizeObserver(function () { if (colado) feed.scrollTop = feed.scrollHeight; }).observe(feed); } catch (e) {}
  function espera(ms) { return new Promise(function (r) { setTimeout(r, calmo ? Math.min(ms, 120) : ms); }); }
  function progresso(p) { barra.style.width = p + "%"; barra.parentNode.setAttribute("aria-valuenow", String(Math.round(p))); }
  function hora() { var d = new Date(); return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2); }

  function linhaPiggy(txt, anima) {
    var l = el("div", "linha" + (anima ? " entra" : "")); l.appendChild(avatar());
    l.appendChild(negrito(el("div", "balao"), txt)); feed.appendChild(l); rolar(); return l;
  }
  function linhaEu(txt, anima) {
    var l = el("div", "linha eu" + (anima ? " entra" : "")); var b = el("div", "balao");
    b.appendChild(el("span", null, txt)); b.insertAdjacentHTML("beforeend", ICON_OK); l.appendChild(b); feed.appendChild(l); rolar(); return l;
  }
  async function digita(txt, vez, ms) {
    var l = el("div", "linha entra"); l.appendChild(avatar());
    var b = el("div", "balao digitando"); b.setAttribute("role", "status"); b.setAttribute("aria-label", "Piggy está digitando");
    b.appendChild(el("span")); b.appendChild(el("span")); b.appendChild(el("span")); l.appendChild(b); feed.appendChild(l); rolar();
    await espera(ms || 650);
    if (vez !== estado.vez) { l.remove(); return false; }
    l.remove(); linhaPiggy(txt, true); return true;
  }
  function limpaRespostas() { resp.textContent = ""; }

  function mostraOpcoes(i) {
    limpaRespostas();
    var box = el("div", "opcoes"); box.setAttribute("role", "group"); box.setAttribute("aria-label", PERGUNTAS[i].p);
    PERGUNTAS[i].o.forEach(function (op, k) {
      var bt = el("button"); bt.type = "button";
      if (op[2]) bt.appendChild(el("span", "emo", op[2]));
      bt.appendChild(el("span", "txt", op[0])); bt.insertAdjacentHTML("beforeend", ICON_SETA);
      bt.addEventListener("click", function () { responde(i, k); });
      box.appendChild(bt);
    });
    resp.appendChild(box); rolar();
    if (teclado) { var pri = box.querySelector("button"); if (pri) pri.focus({ preventScroll: true }); }
  }

  async function pergunta(i) {
    btnVoltar.disabled = i === 0 && estado.respostas.length === 0 ? true : false;
    progresso(i / (N + 1) * 100);
    var vez = estado.vez;
    if (!(await digita(PERGUNTAS[i].p, vez, i === 0 ? 700 : 520))) return;
    mostraOpcoes(i);
  }

  async function responde(i, k) {
    if (estado.respostas.length !== i) return;
    var vez = estado.vez; var op = PERGUNTAS[i].o[k];
    limpaRespostas();
    estado.respostas.push(k);
    if (estado.respostas.length === 1) evento("QuizIniciado");
    rolar(true); linhaEu(op[0], true);
    btnVoltar.disabled = false;
    progresso((i + 1) / (N + 1) * 100);
    if (!(await digita(op[3], vez, 620))) return;
    await espera(260); if (vez !== estado.vez) return;
    if (i + 1 < N) pergunta(i + 1); else pedeNome();
  }

  async function pedeNome() {
    var vez = estado.vez;
    if (!(await digita(PERGUNTA_NOME, vez, 520))) return;
    limpaRespostas();
    var f = el("form", "nome"); f.setAttribute("autocomplete", "off");
    var inp = el("input"); inp.type = "text"; inp.maxLength = 30; inp.placeholder = "Digite seu nome"; inp.setAttribute("aria-label", "Seu nome"); inp.setAttribute("autocapitalize", "words"); inp.setAttribute("enterkeyhint", "send");
    var bt = el("button"); bt.type = "submit"; bt.disabled = true; bt.setAttribute("aria-label", "Ver meu resultado"); bt.innerHTML = ICON_SETA;
    inp.addEventListener("input", function () { bt.disabled = !inp.value.trim(); });
    f.addEventListener("submit", function (e) { e.preventDefault(); var n = inp.value.trim().split(/\s+/)[0]; if (!n) return; estado.nome = n.charAt(0).toUpperCase() + n.slice(1).toLowerCase(); limpaRespostas(); linhaEu(estado.nome, true); resultado(); });
    f.appendChild(inp); f.appendChild(bt); resp.appendChild(f); rolar();
    try { inp.focus({ preventScroll: true }); } catch (e) {}
  }

  function perfilDe(pontos) { return pontos <= 5 ? "explorador" : pontos <= 12 ? "equilibrista" : "sobrevivente"; }

  function cartaoPerfil(chave) {
    var P = PERFIS[chave], c = el("div", "perfil entra");
    c.appendChild(el("small", null, "Seu perfil com dinheiro"));
    c.appendChild(el("h2", null, P.t));
    var d = P.d; c.appendChild(el("p", null, estado.nome + ", " + d.charAt(0).toLowerCase() + d.slice(1)));
    feed.appendChild(c); rolar();
  }

  var waCorpo = null, waTesta = null;
  function cartaoWhats() {
    var w = el("div", "wa entra"); w.setAttribute("role", "group"); w.setAttribute("aria-label", "Conversa de exemplo com o Piggy no WhatsApp");
    var t = el("div", "wa-topo"); t.appendChild(avatar());
    var q = el("div"); q.appendChild(el("b", null, "Piggy")); q.appendChild(el("span", null, "online")); t.appendChild(q);
    t.insertAdjacentHTML("beforeend", '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.6.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7a2.8 2.8 0 0 0 1.8-1.3 2.3 2.3 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3Z"/></svg>');
    w.appendChild(t);
    waCorpo = el("div", "wa-corpo"); w.appendChild(waCorpo);
    waTesta = el("div", "testa"); waTesta.setAttribute("role", "group"); waTesta.setAttribute("aria-label", "Pergunte ao Piggy"); w.appendChild(waTesta);
    w.appendChild(el("p", "wa-nota", "Conversa de exemplo. Valores ilustrativos."));
    feed.appendChild(w); rolar();
  }
  async function trocaWhats(chave, vez, mostrar) {
    function ver(n) { if (mostrar) { try { n.scrollIntoView({ block: "center", behavior: calmo ? "auto" : "smooth" }); } catch (e) {} } else rolar(); }
    var par = DEMO[chave];
    var eu = el("div", "wa-msg eu entra"); eu.appendChild(el("span", null, par[0]));
    var t1 = el("time", null, hora() + " "); t1.insertAdjacentHTML("beforeend", ICON_LIDO); eu.appendChild(t1);
    waCorpo.appendChild(eu); ver(eu);
    await espera(380); if (vez !== estado.vez) return false;
    var dg = el("div", "wa-msg piggy digita"); dg.setAttribute("role", "status"); dg.setAttribute("aria-label", "Piggy está digitando");
    dg.appendChild(el("span")); dg.appendChild(el("span")); dg.appendChild(el("span")); waCorpo.appendChild(dg); ver(dg);
    await espera(900); if (vez !== estado.vez) return false;
    dg.remove();
    var pg = negrito(el("div", "wa-msg piggy entra"), par[1]); pg.appendChild(el("time", null, hora()));
    waCorpo.appendChild(pg); ver(pg);
    return true;
  }

  async function resultado() {
    var vez = estado.vez;
    btnVoltar.disabled = false; progresso(100);
    var pontos = estado.respostas.reduce(function (s, k, i) { return s + PERGUNTAS[i].o[k][1]; }, 0);
    var chave = perfilDe(pontos), P = PERFIS[chave];
    evento("QuizConcluido", { perfil: chave, pontos: pontos });
    if (!(await digita("Pronto, " + estado.nome + ". Já deu pra entender o seu mês.", vez, 700))) return;
    await espera(200); if (vez !== estado.vez) return;
    cartaoPerfil(chave);
    await espera(2400); if (vez !== estado.vez) return;
    if (!(await digita("Agora olha como eu respondo no WhatsApp, com uma pergunta do seu perfil:", vez, 650))) return;
    cartaoWhats();
    await espera(500); if (vez !== estado.vez) return;
    if (!(await trocaWhats(P.demo, vez))) return;
    perguntasNoCartao(P);
    await espera(700); if (vez !== estado.vez) return;
    if (!(await digita(OFERTA[0], vez, 750))) return;
    if (!(await digita(OFERTA[1], vez, 650))) return;
    if (!(await digita(OFERTA[2], vez, 450))) return;
    acoesFinais(P, vez);
    var r = el("button", "refazer"); r.type = "button";
    r.insertAdjacentHTML("beforeend", '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>');
    r.appendChild(document.createTextNode("Refazer o diagnóstico"));
    r.addEventListener("click", recomeca); feed.appendChild(r); rolar();
  }

  function perguntasNoCartao(P) {
    if (!waTesta) return;
    waTesta.textContent = ""; waTesta.appendChild(el("small", null, "Toca pra perguntar:"));
    var ocupado = false;
    P.testa.forEach(function (chave) {
      var b = el("button", null, DEMO[chave][0]); b.type = "button";
      b.addEventListener("click", async function () {
        if (ocupado) return; ocupado = true; b.remove();
        evento("PiggyDemo", { pergunta: chave });
        await trocaWhats(chave, estado.vez, true); ocupado = false;
        if (waTesta && !waTesta.querySelector("button")) { waTesta.remove(); waTesta = null; }
      });
      waTesta.appendChild(b);
    });
  }

  function acoesFinais(P, vez) {
    limpaRespostas();
    var box = el("div", "final");
    var cta = el("a", "cta"); cta.href = comRastreio(LINK_PLANOS);
    cta.appendChild(el("span", null, "Ver os planos e testar grátis")); cta.insertAdjacentHTML("beforeend", ICON_SETA);
    cta.addEventListener("click", function () { evento("QuizPlanosClick"); });
    box.appendChild(cta);
    if (LINK_TESTE) {
      var alt = el("p", "alt"); alt.appendChild(document.createTextNode("Ainda na dúvida? "));
      var a = el("a", null, "Testar o Piggy no WhatsApp"); a.href = comRastreio(LINK_TESTE);
      a.addEventListener("click", function () { try { fbq("trackCustom", "TesteClick"); } catch (e) {} });
      alt.appendChild(a); box.appendChild(alt);
    }
    resp.appendChild(box); rolar();
  }

  /* ---------- voltar e recomeçar ---------- */
  function redesenha() { // conversa até a última resposta, sem animação
    feed.textContent = ""; feed.appendChild(el("div", "hoje", "Hoje"));
    ABERTURA.forEach(function (t) { linhaPiggy(t, false); });
    estado.respostas.forEach(function (k, i) { linhaPiggy(PERGUNTAS[i].p, false); linhaEu(PERGUNTAS[i].o[k][0], false); linhaPiggy(PERGUNTAS[i].o[k][3], false); });
  }
  function voltar() {
    estado.vez++; waCorpo = null; waTesta = null; colado = true; limpaRespostas();
    if (estado.respostas.length === 0) { recomeca(); return; }
    if (estado.nome && estado.respostas.length === N) { estado.nome = ""; redesenha(); pedeNome(); progresso(N / (N + 1) * 100); return; }
    estado.respostas.pop(); estado.nome = ""; redesenha(); pergunta(estado.respostas.length);
  }
  btnVoltar.addEventListener("click", voltar);

  async function recomeca() {
    estado.vez++; estado.respostas = []; estado.nome = ""; waCorpo = null; waTesta = null; colado = true; var vez = estado.vez;
    limpaRespostas(); feed.textContent = ""; feed.appendChild(el("div", "hoje", "Hoje")); progresso(0); btnVoltar.disabled = true;
    for (var i = 0; i < ABERTURA.length; i++) { if (!(await digita(ABERTURA[i], vez, 420))) return; await espera(160); }
    if (vez !== estado.vez) return;
    pergunta(0);
  }
  recomeca();
})();
</script>
</body>
</html>
