name: Tests

# push só na main (pega merge/commit direto); o trabalho de branch é coberto
# pelo pull_request. Antes, `push` + `pull_request` sem filtro rodava o CI DUAS
# vezes a cada push numa branch com PR aberto — dobrava o consumo de minutos.
on:
  push:
    branches: [main]
  pull_request:

# Cancela runs anteriores do mesmo ref quando um novo push chega — vários
# commits seguidos numa branch deixam de acumular runs paralelos até o fim.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bot_financeiro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d bot_financeiro_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bot_financeiro_test
      JWT_SECRET: test-jwt-secret-for-ci-only-32-bytes

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for Postgres
        run: |
          until pg_isready -h localhost -p 5432 -U postgres -d bot_financeiro_test; do
            echo "Waiting for postgres..."
            sleep 2
          done

      - name: Run tests
        run: |
          PYTHONPATH=. pytest -q

  # Varredura de CVE nas dependências. Não-bloqueante: sinaliza sem travar
  # o merge/deploy (uma CVE sem fix disponível não deve segurar a main).
  # O Dependabot (.github/dependabot.yml) abre os PRs de correção.
  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: pip-audit (informativo, nao bloqueia)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt || echo "::warning title=pip-audit::Vulnerabilidades conhecidas encontradas (informativo, nao bloqueia; o Dependabot abre os PRs de correcao)."
