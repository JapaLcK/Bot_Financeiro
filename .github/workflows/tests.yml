name: Tests

# push só na main (pega merge/commit direto); o trabalho de branch é coberto
# pelo pull_request. Antes, `push` + `pull_request` sem filtro rodava o CI DUAS
# vezes a cada push numa branch com PR aberto — dobrava o consumo de minutos.
on:
  push:
    branches: [main]
  pull_request:

# Cancela runs anteriores do mesmo ref quando um novo push chega — vários
# commits seguidos numa branch deixam de acumular runs paralelos até o fim.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bot_financeiro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d bot_financeiro_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bot_financeiro_test
      JWT_SECRET: test-jwt-secret-for-ci-only-32-bytes

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for Postgres
        run: |
          until pg_isready -h localhost -p 5432 -U postgres -d bot_financeiro_test; do
            echo "Waiting for postgres..."
            sleep 2
          done

      - name: Run tests
        run: |
          PYTHONPATH=. pytest -q

  # Testes de frontend (tests/frontend/): Playwright + Chromium contra as páginas
  # reais de frontend/. Job SEPARADO de propósito — não depende de Postgres nem
  # das deps de Python, e roda em paralelo sem somar um segundo ao `pytest`.
  #
  # BLOQUEANTE, de propósito: o download do Chromium (~95 MB) é rede externa e
  # não foi exercitado neste CI ainda. Se ele quebrar, o CI fica vermelho e a
  # gente descobre na hora — falha ruidosa vale mais que um job que sinaliza
  # sozinho e ninguém lê.
  frontend:
    runs-on: ubuntu-latest
    # Sem isto o default é 360 min: um download de Chromium travado queimaria
    # 6 horas de runner antes de desistir.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install Playwright + Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run frontend tests
        run: npm run test:frontend

  # Varredura de CVE nas dependências. Não-bloqueante: sinaliza sem travar
  # o merge/deploy (uma CVE sem fix disponível não deve segurar a main).
  # O Dependabot (.github/dependabot.yml) abre os PRs de correção.
  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: pip-audit (informativo, nao bloqueia)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt || echo "::warning title=pip-audit::Vulnerabilidades conhecidas encontradas (informativo, nao bloqueia; o Dependabot abre os PRs de correcao)."
