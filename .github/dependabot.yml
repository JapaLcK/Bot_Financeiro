version: 2
updates:
  # Dependências Python (requirements.txt na raiz do repo)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Janela de segurança: espera N dias após publicação antes de abrir PR,
    # pra não puxar uma versão recém-comprometida (supply-chain).
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    # Agrupa updates de patch/minor num único PR pra reduzir ruído (dev solo).
    # CVEs de segurança abrem PR próprio mesmo assim.
    groups:
      python-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    # O `pydantic` prende o `pydantic-core` numa versão EXATA (não num piso).
    # Subir o core sozinho dá `ResolutionImpossible` — aconteceu no #301 e no
    # #342. Ele só deve andar junto com o `pydantic`, que o arrasta.
    ignore:
      - dependency-name: "pydantic_core"

  # Dependências npm da raiz (tooling de teste/lint do frontend: Playwright, ESLint).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      # `eslint` e `@eslint/js` são versionados EM PAR: um em 10 com o outro
      # em 9 não instala (#335/#337 morreram no `npm ci`). Salto maior não cai
      # no grupo de minor/patch, então precisa de grupo próprio.
      eslint:
        patterns:
          - "eslint"
          - "@eslint/*"

  # Dependências npm do app iOS (casca Capacitor). São poucas e diretas, mas a
  # cadeia de build é o que assina o binário — CVE aqui é supply-chain de release.
  - package-ecosystem: "npm"
    directory: "/mobile"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    groups:
      mobile-npm-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      # As peças do Capacitor sobem JUNTAS: `ios`, `core`, `cli`, `app` e
      # `push-notifications` são o mesmo framework, e uma sozinha deixa o app
      # iOS com versões misturadas (#336, #338-#341).
      capacitor:
        patterns:
          - "@capacitor/*"

  # Dependências npm do app nativo (Expo/React Native). Quarto ecossistema do
  # repo, e o único cuja cadeia termina num binário assinado e distribuído pelas
  # lojas — uma dependência comprometida aqui viaja para o aparelho do usuário.
  - package-ecosystem: "npm"
    directory: "/app"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    groups:
      app-npm-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    # ATENÇÃO: subir o SDK do Expo não é atualização de dependência, é migração —
    # mexe em build nativo, na versão de React Native e nas versões pareadas de
    # todo `expo-*`. Merge só com build de verdade rodado.
    #
    # O bloqueio precisa cobrir o CONJUNTO, não só o pacote `expo`: agrupar não
    # obriga ninguém a andar junto, então com só o `expo` ignorado o Dependabot
    # subiria `expo-router` ou `expo-secure-store` para o SDK seguinte deixando
    # o `expo` em 57 — exatamente o build misto que este comentário existe para
    # impedir. O `react-native` entra pelo mesmo motivo: a versão dele é
    # escolhida PELO SDK, não por nós.
    #
    # A lista cobre o mapa offline do SDK (os declarados no
    # `expo/bundledNativeModules.json` do expo instalado), o próprio `expo` e o par
    # `react-test-renderer` (anda com o `react`). O CI compara com o mapa e reprova
    # versão fora da faixa dele (#1442, #466); o dono decidiu parar tudo o que o SDK
    # escolhe em todos os eixos, patch incluído, para que só `npx expo install --fix`
    # mova esses pacotes. O `ignore` bloqueia também o PR de segurança deles: CVE
    # vira só alerta, e o conserto é `npx expo install --fix` ou bump manual. O
    # tooling que só a API do Expo escolhe tem entrada própria no fim da lista. A
    # lista é conferida por app/__tests__/dependabot_sdk_expo.test.ts.
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "jest-expo"
      # `react` e `react-dom` NÃO andam sozinhos, em nenhum eixo. O React Native
      # embute uma versão EXATA do renderer e a compara no primeiro render: um
      # PR que suba só o React recria a falha de inicialização que já aconteceu
      # neste projeto (react 19.3.0 contra o renderer 19.2.3). E o CI do app não
      # monta componente nem gera binário, então mergearia verde.
      # Quem escolhe a versão é o SDK do Expo; subir React é migração de SDK.
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-test-renderer"
      # `react-native` está em 0.x, e em 0.x o TREM é o minor: 0.84 → 0.85 é
      # mudança de versão do React Native, não correção. Nem o patch anda
      # sozinho: o mapa do SDK fixa a versão exata, sem faixa, e o CI reprova
      # qualquer outra.
      - dependency-name: "react-native"
      - dependency-name: "@react-native-community/datetimepicker"
      - dependency-name: "@react-native-community/slider"
      - dependency-name: "@sentry/react-native"
      - dependency-name: "react-native-reanimated"
      - dependency-name: "react-native-safe-area-context"
      - dependency-name: "react-native-screens"
      - dependency-name: "react-native-svg"
      - dependency-name: "react-native-webview"
      - dependency-name: "react-native-worklets"
      # Tooling: o SDK escolhe a faixa pela API do Expo (`relatedPackages`, só no
      # modo online), não pelo mapa offline. Para `typescript`, `@types/react` e
      # `jest` a faixa é `~`: o patch cabe nela e continua chegando; major e minor
      # ficam com o SDK. O `@types/jest` o SDK fixa em versão exata, sem `~`, então
      # fica parado em todos os eixos, como os nativos. Não há fonte offline para
      # conferir esta lista: reconferir ao subir o SDK. Pacote que faltar nela só
      # aparece depois, sem bloquear, no `app-expo-online.yml`.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "jest"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@types/jest"

  # Dependências npm da ilha React da /precos (webapp/). Terceiro lockfile do
  # repositório, e o que produz um arquivo SERVIDO na página que vende: react,
  # react-dom, vite e a cadeia nativa de build (rolldown, lightningcss).
  - package-ecosystem: "npm"
    directory: "/webapp"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    groups:
      webapp-npm-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      # `react` e `react-dom` são versionados EM PAR pelo próprio projeto: um em
      # 19.3 com o outro em 19.4 é combinação que o React não suporta.
      react:
        patterns:
          - "react"
          - "react-dom"
    # ATENÇÃO ao mergear qualquer PR daqui: os artefatos `frontend/precos-app.*`,
    # `chat-app.*` e `dashboard-app.*` são COMMITADOS, e o Dependabot não roda o
    # build. Depois de subir dep, rode
    # `npm --prefix webapp ci && npm --prefix webapp run build` e commite o
    # resultado junto — senão o gate que rebuilda no CI reprova (e é para reprovar: a
    # produção estaria servindo o bundle da versão anterior).

  # Actions usadas nos workflows (.github/workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci"
