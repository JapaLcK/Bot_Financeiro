version: 2
updates:
  # Dependências Python (requirements.txt na raiz do repo)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Janela de segurança: espera N dias após publicação antes de abrir PR,
    # pra não puxar uma versão recém-comprometida (supply-chain).
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    # Agrupa updates de patch/minor num único PR pra reduzir ruído (dev solo).
    # CVEs de segurança abrem PR próprio mesmo assim.
    groups:
      python-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    # O `pydantic` prende o `pydantic-core` numa versão EXATA (não num piso).
    # Subir o core sozinho dá `ResolutionImpossible` — aconteceu no #301 e no
    # #342. Ele só deve andar junto com o `pydantic`, que o arrasta.
    ignore:
      - dependency-name: "pydantic_core"

  # Dependências npm da raiz (tooling de teste/lint do frontend: Playwright, ESLint).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      # `eslint` e `@eslint/js` são versionados EM PAR: um em 10 com o outro
      # em 9 não instala (#335/#337 morreram no `npm ci`). Salto maior não cai
      # no grupo de minor/patch, então precisa de grupo próprio.
      eslint:
        patterns:
          - "eslint"
          - "@eslint/*"

  # Dependências npm do app iOS (casca Capacitor). São poucas e diretas, mas a
  # cadeia de build é o que assina o binário — CVE aqui é supply-chain de release.
  - package-ecosystem: "npm"
    directory: "/mobile"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    groups:
      mobile-npm-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      # As peças do Capacitor sobem JUNTAS: `ios`, `core`, `cli`, `app` e
      # `push-notifications` são o mesmo framework, e uma sozinha deixa o app
      # iOS com versões misturadas (#336, #338-#341).
      capacitor:
        patterns:
          - "@capacitor/*"

  # Dependências npm da ilha React da /precos (webapp/). Terceiro lockfile do
  # repositório, e o que produz um arquivo SERVIDO na página que vende: react,
  # react-dom, vite e a cadeia nativa de build (rolldown, lightningcss).
  - package-ecosystem: "npm"
    directory: "/webapp"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    groups:
      webapp-npm-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      # `react` e `react-dom` são versionados EM PAR pelo próprio projeto: um em
      # 19.3 com o outro em 19.4 é combinação que o React não suporta.
      react:
        patterns:
          - "react"
          - "react-dom"
    # ATENÇÃO ao mergear qualquer PR daqui: o artefato `frontend/precos-app.*` é
    # COMMITADO, e o Dependabot não roda o build. Depois de subir dep, rode
    # `npm --prefix webapp ci && npm --prefix webapp run build` e commite o
    # resultado junto — senão o gate que rebuilda no CI reprova (e é para reprovar: a
    # produção estaria servindo o bundle da versão anterior).

  # Actions usadas nos workflows (.github/workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci"
